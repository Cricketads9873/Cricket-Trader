  <style>
    :root { --bg:#100719; --green:#38df79; --green2:#79f2a5; --purple:#8529ee; --ink:#32106c; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; min-height:100%; }
    body { min-height:100svh; min-height:100dvh; overflow:hidden; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#fff; background:radial-gradient(ellipse at 50% 48%, #261039 0%, #180a24 42%, #0d0613 100%); }
    .scene { position:relative; min-height:100svh; min-height:100dvh; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:22px 18px; isolation:isolate; }
    .grid { position:absolute; inset:0; z-index:-3; opacity:.12; background-image:linear-gradient(to right, transparent calc(50% - 1px), #8f70a7 calc(50% - 1px), #8f70a7 calc(50% + 1px), transparent calc(50% + 1px)),linear-gradient(to bottom, transparent calc(25% - 1px), #8f70a7 calc(25% - 1px), #8f70a7 calc(25% + 1px), transparent calc(25% + 1px)),linear-gradient(to bottom, transparent calc(75% - 1px), #8f70a7 calc(75% - 1px), #8f70a7 calc(75% + 1px), transparent calc(75% + 1px)); }
    .orb { position:absolute; width:5px;height:5px;border-radius:50%;background:#36df81;opacity:.45;box-shadow:0 0 12px #35ef84; z-index:-1; }

    .frame { position:absolute; inset:50% 0 auto; transform:translateY(-50%); height:80%; border:5px solid #42e980; border-radius:42px; box-shadow:0 0 13px #2be879, inset 0 0 26px rgba(44,232,119,.05); }
    .content { position:relative; z-index:1; width:100%; text-align:center; padding:36px 12px; display:flex; flex-direction:column; align-items:center; }
    .brand-row { display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 16px; }
    .logo { width:clamp(72px, 12vw, 96px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; flex:none; background:radial-gradient(circle at 35% 25%, #c45aff, #7622df 58%, #35105e); border:4px solid #a7a4b5; box-shadow:0 0 0 5px rgba(126,48,224,.16),0 0 22px rgba(151,48,255,.5); }
    .logo svg { width:75%; height:75%; }
    .name { text-align:left; line-height:.9; min-width:0; }
    .name h1 { margin:0; font-size:clamp(36px, 8.5vw, 62px); font-weight:1000; font-style:italic; letter-spacing:-2.5px; text-transform:uppercase; color:#fff; text-shadow:2px 3px 0 #6d20b8; white-space:nowrap; }
    .name p { margin:9px 0 0 3px; color:#54ee99; letter-spacing:clamp(3px,1vw,6px); font-size:clamp(11px,2.7vw,16px); font-weight:900; white-space:nowrap; }
    .tagline { color:#c1b1d0; font-size:clamp(13px,3.5vw,17px); font-weight:700; margin:0; display:flex; align-items:center; gap:8px; }
    .tagline svg { width:22px; height:22px; opacity:.9; }
    .join { position:absolute; left:50%; transform:translateX(-50%); width:min(82%, 420px); min-height:clamp(66px, 12vh, 82px); border-radius:999px; border:1px solid rgba(218,255,230,.75); display:flex; align-items:center; justify-content:center; gap:17px; color:#2f0a68; text-decoration:none; font-weight:950; font-size:clamp(21px, 4.8vw, 31px); letter-spacing:-.5px; background:linear-gradient(180deg,#83f0ac 0%,#40df7b 62%,#28c96a 100%); box-shadow:0 12px 24px rgba(40,226,116,.18),0 0 24px rgba(53,234,125,.13); transition:transform .15s ease, filter .15s ease; }
    .join:active { transform:translateX(-50%) scale(.98); filter:brightness(1.05); }
    .join.top { top:0; }
    .join.bottom { bottom:0; }
    .telegram { width:32px;height:32px; flex:none; }
    .shine { position:absolute; left:-18px; top:69%; width:95px; height:70px; background:linear-gradient(110deg,rgba(255,255,255,.75),rgba(255,255,255,0)); transform:skewX(-28deg); opacity:.45; z-index:-1; }
    @media (max-width:360px) { .card{height:390px}.brand-row{gap:10px}.name h1{letter-spacing:-2px}.logo{width:66px}.frame{border-width:4px;border-radius:34px}.join{width:86%;gap:12px} }
    @media (min-height:850px) { .card{height:clamp(430px,53vh,540px)} }
  </style>
</head>
